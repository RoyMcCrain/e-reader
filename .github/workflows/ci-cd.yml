name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile
        shell: bash

      - name: Prepare generated types
        run: vp exec void prepare
        shell: bash

      - name: Validate local database migrations
        run: vp exec void db migrate
        shell: bash

      - name: Typecheck
        run: vp exec tsc --noEmit
        shell: bash

      - name: Lint
        run: vp lint
        shell: bash

      - name: Check formatting
        run: vp fmt --check
        shell: bash

      - name: Unit tests
        run: vp test --config vitest.config.ts
        shell: bash

      - name: R2 storage test
        run: vp run test:r2
        shell: bash

      - name: D1 storage tests
        run: vp run test:d1
        shell: bash

      - name: Install Playwright Chromium
        run: vp exec playwright install --with-deps chromium
        shell: bash

      - name: Playwright tests
        run: CI=true vp run test:e2e --workers 1
        shell: bash

      - name: Build
        run: vp build
        shell: bash

      - name: Production PWA smoke test
        run: CI=true vp run test:pwa --workers 1
        shell: bash

  deploy:
    name: Deploy production
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://reader.rrrr.dev
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile
        shell: bash

      - name: Migrate D1 and deploy with service authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CF_ACCESS_READINESS_ORIGIN: https://reader.rrrr.dev
        run: bash src/deploy/deploy.sh
        shell: bash

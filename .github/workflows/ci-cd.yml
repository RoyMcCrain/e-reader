name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile
        shell: bash

      - name: Prepare generated types
        run: bunx --no-install void prepare
        shell: bash

      - name: Typecheck
        run: bun run typecheck
        shell: bash

      - name: Lint
        run: bun run lint
        shell: bash

      - name: Check formatting
        run: bun run format:check
        shell: bash

      - name: Unit tests
        run: bun test
        shell: bash

      - name: R2 storage test
        run: bun run test:r2
        shell: bash

      - name: Install Playwright Chromium
        run: bunx --bun --no-install playwright install --with-deps chromium
        shell: bash

      - name: Playwright tests
        run: CI=true bun run test:e2e --workers 1
        shell: bash

      - name: Build
        run: bun run build
        shell: bash

  deploy:
    name: Deploy production
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://reader.rrrr.dev
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile
        shell: bash

      - name: Deploy with service authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CF_ACCESS_READINESS_ORIGIN: https://reader.rrrr.dev
        run: bash src/deploy/deploy.sh
        shell: bash
